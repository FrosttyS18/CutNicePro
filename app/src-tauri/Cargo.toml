[package]
name = "cutnicepro"
version = "0.19.0"
description = "CutNicePro — smart video clipping (M1: app + projects)"
edition = "2021"

[lib]
name = "cutnicepro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# reqwest: cliente HTTP local para o llama-server multimodal (feature
# "blocking" adicionada no M3 goal-cortes-multimodais: o caminho de geração
# roda em spawn_blocking; mesma crate/versão já usada pelo app.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
fs2 = "0.4"
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
